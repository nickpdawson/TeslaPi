[project]
name = "teslapi"
version = "0.3.0"
description = "Modern web dashboard for TeslaUSB - dashcam, music sync, and Home Assistant integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "websockets>=13.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The importable package is `backend/` (no src/ layout), so tell hatchling which
# package to build — without this `pip install -e .` fails to infer the layout.
[tool.hatch.build.targets.wheel]
packages = ["backend"]
